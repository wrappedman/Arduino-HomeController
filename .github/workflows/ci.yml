name: SHAP build and tests
on:
  push:
    branches: [arena/8a6b6b7d-arduino-homecontroller]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node --check data/app.js
      - run: python3 -m unittest discover -s test -p 'test_*.py'
  arduino-ide-sketch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install Arduino IDE board core and sketch libraries
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@2.0.17 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install 'ArduinoJson@6.21.5'
          arduino-cli lib install 'WebSockets@2.6.1'
      - name: Compile the exact Arduino IDE sketch
        run: |
          arduino-cli compile --fqbn 'esp32:esp32:esp32s3:FlashSize=16M,FlashMode=qio,PSRAM=opi,CDCOnBoot=default' --build-path "$RUNNER_TEMP/shap-arduino-build" arduino/SHAP
          test -s "$RUNNER_TEMP/shap-arduino-build/SHAP.bin"
          cmp arduino/SHAP/partitions.csv "$RUNNER_TEMP/shap-arduino-build/partitions.csv"
          test "$(stat -c %s "$RUNNER_TEMP/shap-arduino-build/SHAP.bin")" -lt 5242880
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: platformio.ini
      - run: python -m pip install platformio
      - uses: actions/cache/restore@v4
        id: pio-cache
        with:
          path: |
            ~/.platformio/platforms
            ~/.platformio/packages
            ~/.platformio/.cache
          key: pio-espressif32-6-13-arduino2-${{ runner.os }}
      - name: Compile ESP32-S3 firmware
        shell: bash
        run: |
          if ! pio run > pio-build.log 2>&1; then
            tail -n 85 pio-build.log
            python - <<'PYLOG'
          from pathlib import Path
          import re
          lines=Path('pio-build.log').read_text(errors='replace').splitlines()
          issues=[line for line in lines if re.search(r'error:|fatal error|Error:|FAILED|undefined reference|\*\*\*',line,re.I)]
          text='\n'.join((issues[-35:]+['--- final lines ---']+lines[-18:]))[-3700:]
          print('::error title=PlatformIO build failure::'+text.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          PYLOG
            exit 1
          fi
          tail -n 30 pio-build.log
      - name: Verify release images
        run: |
          cd .pio/build/esp32-s3-devkitc-1-n16r8
          sha256sum firmware.bin bootloader.bin partitions.bin > checksums.sha256
          test -s firmware.bin && test -s bootloader.bin && test -s partitions.bin
      - uses: actions/cache/save@v4
        if: ${{ always() && steps.pio-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.platformio/platforms
            ~/.platformio/packages
            ~/.platformio/.cache
          key: pio-espressif32-6-13-arduino2-${{ runner.os }}
      - uses: actions/upload-artifact@v4
        with:
          name: shap-esp32-s3-n16r8-unvalidated
          path: |
            .pio/build/esp32-s3-devkitc-1-n16r8/firmware.bin
            .pio/build/esp32-s3-devkitc-1-n16r8/bootloader.bin
            .pio/build/esp32-s3-devkitc-1-n16r8/partitions.bin
            .pio/build/esp32-s3-devkitc-1-n16r8/checksums.sha256
          if-no-files-found: error
