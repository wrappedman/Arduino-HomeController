<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="One Arduino IDE Upload sends the firmware with all web assets to the ESP32-S3 program flash; LittleFS stores configuration only">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5 0 10" fill="none" stroke="#178565" stroke-width="1.6"/></marker><style>text{font-family:Arial,sans-serif;fill:#193742}.title{font-size:27px;font-weight:700}.sub{font-size:16px;fill:#567179}.file{font:700 20px Arial,sans-serif}.tiny{font:15px Arial,sans-serif;fill:#527073}.head{font:700 17px Arial,sans-serif;fill:#106b55}.box{fill:#fff;stroke:#cadcd7;stroke-width:2}.green{fill:#eaf8f1;stroke:#76c8a7}.blue{fill:#e9f3fb;stroke:#8bb8d8}.arrow{fill:none;stroke:#188565;stroke-width:3;marker-end:url(#arrow)}</style></defs>
<rect width="1200" height="560" fill="#f3f8f6"/><text x="46" y="51" class="title">Arduino IDE: one sketch, one Upload</text><text x="46" y="81" class="sub">Open arduino/SHAP/SHAP.ino. No separate filesystem uploader or web hosting service.</text>
<rect x="42" y="125" width="342" height="124" rx="14" class="box"/><text x="62" y="160" class="head">SKETCH</text><text x="62" y="194" class="file">SHAP.ino + *.cpp/*.h</text><text x="62" y="226" class="tiny">controller and API source code</text>
<rect x="425" y="125" width="342" height="124" rx="14" class="box"/><text x="445" y="160" class="head">BUILT-IN WEB ASSETS</text><text x="445" y="194" class="file">EmbeddedAssets.cpp</text><text x="445" y="226" class="tiny">HTML, JS, CSS, fonts, guide, images</text>
<rect x="808" y="125" width="350" height="124" rx="14" class="box"/><text x="828" y="160" class="head">FLASH MAP</text><text x="828" y="194" class="file">partitions.csv</text><text x="828" y="226" class="tiny">N16R8 / dual OTA / config LittleFS</text>
<path d="M210 252V294H460V315" class="arrow"/><path d="M596 252V310" class="arrow"/><path d="M982 252V294H731V315" class="arrow"/>
<rect x="195" y="326" width="810" height="92" rx="14" class="green"/><text x="218" y="360" class="head">ARDUINO IDE: VERIFY, THEN UPLOAD</text><text x="218" y="395" class="file">firmware.bin with all local web assets → ESP32-S3 program flash</text>
<rect x="195" y="452" width="810" height="75" rx="14" class="blue"/><text x="218" y="481" class="head">ON THE BOARD AFTER FIRST BOOT</text><text x="218" y="507" class="tiny">Web pages are served from program flash. LittleFS stores /config.json only.</text>
</svg>
