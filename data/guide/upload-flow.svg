<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-label="PlatformIO reads platformio.ini, src and data in the project folder; upload sends firmware and boot files, uploadfs sends the LittleFS image">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0l9 4.5L0 9" fill="none" stroke="#188565" stroke-width="1.6"/></marker><style>text{font-family:Arial,sans-serif;fill:#193742}.title{font-size:29px;font-weight:700}.sub{font-size:17px;fill:#567179}.file{font:700 21px Arial,sans-serif}.tiny{font:15px Arial,sans-serif;fill:#527073}.head{font:700 17px Arial,sans-serif;fill:#106b55}.box{fill:#fff;stroke:#cadcd7;stroke-width:2}.green{fill:#eaf8f1;stroke:#76c8a7}.blue{fill:#e9f3fb;stroke:#8bb8d8}.arrow{fill:none;stroke:#188565;stroke-width:3;marker-end:url(#arrow)}</style></defs>
<rect width="1200" height="620" fill="#f3f8f6"/><text x="48" y="56" class="title">Where PlatformIO finds the files</text><text x="48" y="87" class="sub">Run every command inside the extracted project folder (the one containing platformio.ini).</text>
<rect x="42" y="112" width="1116" height="92" rx="14" class="box"/><text x="63" y="144" class="head">PROJECT ROOT</text><text x="63" y="177" class="file">platformio.ini</text><text x="270" y="171" class="tiny">environment: esp32-s3-devkitc-1-n16r8</text><text x="715" y="171" class="tiny">board: shap-esp32-s3-n16r8</text>
<rect x="42" y="245" width="350" height="112" rx="14" class="box"/><text x="63" y="282" class="file">src/ + libraries</text><text x="63" y="317" class="tiny">controller program (Arduino C++)</text>
<rect x="425" y="245" width="350" height="112" rx="14" class="box"/><text x="446" y="282" class="file">partitions/ + boards/</text><text x="446" y="317" class="tiny">flash layout + N16R8 profile</text>
<rect x="808" y="245" width="350" height="112" rx="14" class="box"/><text x="829" y="282" class="file">data/</text><text x="829" y="317" class="tiny">HTML, JS, CSS, fonts, guide, images</text>
<path d="M216 358V402" class="arrow"/><path d="M600 358V382H370V402" class="arrow"/><path d="M982 358V402" class="arrow"/>
<rect x="42" y="406" width="714" height="121" rx="14" class="green"/><text x="63" y="443" class="head">pio run: BUILD ONLY</text><text x="63" y="476" class="file">firmware.bin + boot / partition files</text><text x="63" y="507" class="tiny">pio run -t upload: FLASH these files to the board</text>
<rect x="789" y="406" width="369" height="121" rx="14" class="blue"/><text x="810" y="443" class="head">pio run -t buildfs: BUILD ONLY</text><text x="810" y="476" class="file">littlefs.bin</text><text x="810" y="507" class="tiny">pio run -t uploadfs: FLASH web assets</text>
<text x="48" y="573" class="sub">First install needs BOTH upload and uploadfs. uploadfs may erase existing /config.json; back up before reuse.</text>
</svg>
